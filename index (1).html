<html lang="en"><head><meta charset="utf-8">

<style>

.c1,.c2,.c3,.c4,.c5{border-color:transparent}.c1{background:#e3d8f5}.c2{background:#cfe3f6}.c3{background:#d3efdc}.c4{background:#f9dccd}.c5{background:#fbefc4}

.b{border:1px solid var(--bd);background:#fff;border-radius:99px;padding:10px 18px;font-weight:600;font-size:14px;font-family:inherit;min-height:44px;color:var(--tx);cursor:pointer}
.b.p,.b.blk{background:var(--ink);color:#fff;border-color:var(--ink)}.b.d{color:var(--rd)}.b.s{min-height:40px;padding:6px 14px;font-size:13px}.b.on{background:var(--pl);border-color:var(--pri);color:var(--pd)}.b.w{width:100%}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:14px;background:#fff;color:var(--tx);min-height:44px}
label{display:block;font-size:13px;font-weight:600;color:var(--mu);margin-bottom:10px}label input,label select,label textarea{margin-top:4px}
label.ck{display:flex;gap:10px;align-items:center;color:var(--tx);font-weight:500;font-size:14px}label.ck input{width:24px;min-height:24px;margin:0}
.bar{height:8px;background:rgba(95,79,160,.12);border-radius:4px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--pd);border-radius:4px}

.ac{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;border:1px solid var(--bd);background:#fff;border-radius:14px;padding:6px 0;min-height:50px;font-weight:700;font-size:13px;color:var(--mu);font-family:inherit}.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.tabs small{display:block;font-weight:500;font-size:11px}
.em{text-align:center;color:var(--mu);padding:28px 12px;border:1px dashed #d8cfc0;border-radius:20px;background:#fff}
.row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.ra{display:flex;gap:8px;justify-content:flex-end}
.mo{position:fixed;inset:0;background:rgba(23,26,44,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.md{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px}.md h2{font-size:20px;margin-bottom:12px}
.er{color:var(--rd);font-size:13px;margin-bottom:8px}
@media(min-width:700px){.mo{align-items:center}.md{border-radius:24px}}
.tr{display:flex;gap:6px;align-items:flex-end;height:130px}.tr div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:10px;color:var(--mu);min-width:0}.tr i{display:block;width:100%;background:var(--pri);border-radius:6px 6px 0 0}
.hw{border-left:5px solid var(--bd)}.hw.u{border-left-color:#e2b560}.hw.o{border-left-color:var(--rd)}.hw.dn b{text-decoration:line-through;color:var(--mu)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;z-index:30;display:none}
pre{white-space:pre-wrap;font:inherit}

.sub{color:var(--mu);margin:-8px 0 16px;font-size:14.5px}
#t,.big,.hh,.logo,h2{font-family:"Outfit",system-ui,sans-serif}
.card,.hero,.sl{box-shadow:0 1px 2px rgba(23,26,44,.04),0 6px 18px -10px rgba(95,79,160,.22)}
.c1,.c2,.c3,.c4,.c5{box-shadow:none}
.lb{display:block;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#3b3f58;opacity:.75;margin-bottom:10px}
.hero:before{content:"";position:absolute;right:70px;bottom:-26px;width:86px;height:86px;border-radius:50%;background:#d3efdc;pointer-events:none}
.hero>*{position:relative;z-index:1}
.sl{transition:transform .15s}.sl.school,.sl.tuition{background:#f2f7fd}.sl.workout{background:#f1faf5}.sl.study,.sl.test{background:#f8f5fd}.sl.homework{background:#fffaf1}.sl.sleep{background:#eeebe5}.sl.ms{background:#fff4e0}
.tm{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:4px 8px;text-align:center;align-self:flex-start;min-width:76px;line-height:1.35}
.sj0{border-top:4px solid #c9b8ee}.sj1{border-top:4px solid #a9dbbd}.sj2{border-top:4px solid #f2b99c}.sj3{border-top:4px solid #9cc3e8}.sj4{border-top:4px solid #ecd27a}.sj5{border-top:4px solid #c5c8d6}.sj6{border-top:4px solid #e0d9cc}
input[type=checkbox]{accent-color:var(--pd)}
.b{transition:transform .1s,background .15s}.b:active{transform:scale(.97)}.b:not(.p):not(.blk):hover{background:var(--pl)}
input:focus,select:focus,textarea:focus,.b:focus-visible,#nv button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.mo{backdrop-filter:blur(3px)}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
#app>*{animation:up .35s ease both}
@media(prefers-reduced-motion:reduce){#app>*{animation:none}}
@media(min-width:820px){#t{font-size:36px}.hh{font-size:34px}.hero{padding:30px}}
</style></head><body>

<script>

(a.length?a.map(h=>{const u=hwDue(h);return'<div class="card hw '+u+(h.done?' dn':'')+'"><div style="display:flex;gap:10px"><label class="ck" style="margin:0"><input type="checkbox" data-a="th" data-i="'+h.id+'"'+(h.done?' checked':'')+'></label><div style="flex:1;min-width:0"><b style="overflow-wrap:anywhere">'+esc(h.t)+'</b><div><span class="chip t">'+esc(h.sub)+'</span><span class="chip '+(h.pri=='High'?'High':h.pri=='Low'?'Low':'')+'">'+h.pri+'</span><span class="chip '+(u=='o'?'od':'')+'">'+(u=='o'?'Overdue · ':'Due ')+fd(h.due)+'</span>'+(h.est?'<span class="chip">'+h.est+' min</span>':'')+'</div>'+(h.n?'<pre class="mu">'+esc(h.n)+'</pre>':'')+'<div class="ac">'+(h.done?'':'<button class="b s" data-a="rh" data-i="'+h.id+'">Reschedule</button>')+'<button class="b s" data-a="eh" data-i="'+h.id+'">Edit</button></div></div></div></div>'}).join(''):'<div class="em">'+(S.hw.length?'Nothing in this filter.':'No homework yet. Tap “Add homework”.')+'</div>')}

nav:i=>{view=i;render();scrollTo(0,0)},day:i=>{day=i;render()},hol:()=>{const k=wd(day);if(S.hol[k])delete S.hol[k];else S.hol[k]=1;save();render();toast(S.hol[k]?'Holiday routine applied':'Regular routine restored')},

render();
